<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito – ABELISSE</title>
  <meta name="description" content="Tu carrito de compras en ABELISSE.">
  <link rel="stylesheet" href="css/style.css">

  <!-- Favicon ABELISSE -->
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="shortcut icon" href="img/logo.png">

  <!-- SDK oficial de PayPal con tu Client ID -->
  <script src="https://www.paypal.com/sdk/js?client-id=AZjDiJrX6cEl9XUHSBlz9-WwFhyPSnsmzlaSCdWN_SA6XjruJlKsn_Fa9e7o9scODlXsis3ECA23FKqG&components=buttons"></script>
</head>

<body class="carrito-page">

<header class="header">
  <div class="header-toast" id="toast">Producto actualizado</div>
  <nav class="header-inner container">
    <div class="header-left">
      <a href="index.html" class="header-logo">ABELISSE</a>
      <div class="header-search">
        <input type="text" id="searchInput" placeholder="Buscar productos..." />
        <button id="searchBtn">IR</button>
      </div>
    </div>
    <button class="header-toggle" id="menuToggle">☰</button>
    <div class="header-nav" id="navMenu">
      <a href="index.html" class="nav-link">Inicio</a>
      <a href="productos.html" class="nav-link">Productos</a>
      <a href="ofertas.html" class="nav-link">Ofertas</a>
      <a href="contacto.html" class="nav-link">Contacto</a>
      <a href="carrito.html" class="nav-cart active">
        Carrito <span class="cart-count">0</span>
      </a>
    </div>
  </nav>
</header>

<main class="section">
  <div class="container carrito-premium">
    <h1 class="carrito-title">Tu carrito</h1>
    <p id="carrito-moneda" class="carrito-moneda"></p>

    <!-- LISTA -->
    <div id="carrito-lista" class="carrito-lista"></div>

    <!-- TOTAL -->
    <div id="carrito-total" class="carrito-total-box"></div>

    <!-- BOTONES -->
    <div id="carrito-botones" class="carrito-botones-premium"></div>
  </div>
</main>

<footer class="footer">
  <!-- Mantengo todo tu footer tal cual lo tenías -->
</footer>

<script src="js/geo.js"></script>
<script src="js/main.js"></script>

<script>
  async function sendCheckout(method, total, carrito) {
    let endpoint = "";

    if (method === "stripe") {
      endpoint = "https://abelisse.onrender.com/api/checkout/create-session/";
    } else if (method === "paypal") {
      endpoint = "https://abelisse.onrender.com/api/paypal/create-order/";
    } else if (method === "yape") {
      alert("Yape estará disponible pronto.");
      return;
    }

    const body = {
      total: total,
      carrito: carrito.map(i => ({
        id: i.id,
        cantidad: i.qty
      })),
      email: null,
      nombre: null
    };

    try {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      const data = await res.json();

      if (data.checkout_url) {
        window.location.href = data.checkout_url;
      } else if (data.approve_url) {
        window.location.href = data.approve_url;
      } else {
        alert("Error iniciando pago.");
      }

    } catch (err) {
      alert("Error conectando con el servidor.");
    }
  }
  function renderCarrito() {
    const carrito = getCart();
    const lista = document.getElementById("carrito-lista");
    const totalBox = document.getElementById("carrito-total");
    const botonesBox = document.getElementById("carrito-botones");
    const monedaBox = document.getElementById("carrito-moneda");

    const geo = window.ABELISSE_GEO || { country: "US" };
    const isPeru = geo.country === "PE";

    monedaBox.textContent = isPeru
      ? "Precios en Soles (PEN)"
      : "Precios en Dólares (USD)";

    if (!carrito || carrito.length === 0) {
      lista.innerHTML = `
        <div class="carrito-vacio">
          <h2>Tu carrito está vacío</h2>
          <p>Explora nuestros productos y añade tus favoritos.</p>
          <a href="productos.html" class="btn btn-primary">Ver productos</a>
        </div>
      `;
      totalBox.innerHTML = "";
      botonesBox.innerHTML = "";
      return;
    }

    let total = 0;
    lista.innerHTML = carrito.map(item => {
      const price = isPeru
        ? Number(item.price_pen ?? item.price_usd ?? 0)
        : Number(item.price_usd ?? item.price_pen ?? 0);
      const stock = Number(item.stock ?? 10);
      const qty = Number(item.qty ?? 1);
      total += price * qty;
      const img = item.media ? item.media : "img/placeholder.png";

      return `
        <div class="carrito-card">
          <div class="carrito-card-img">
            <img src="${img}" alt="${item.name}">
          </div>
          <div class="carrito-card-info">
            <h3>${item.name}</h3>
            <p class="carrito-card-price">${isPeru ? "S/" : "$"} ${price.toFixed(2)}</p>
            <div class="carrito-stepper">
              <button onclick="decreaseQty('${item.id}')">−</button>
              <span>${qty}</span>
              <button onclick="increaseQty('${item.id}', ${stock})">+</button>
            </div>
            <button class="carrito-remove-btn" onclick="removeItem('${item.id}')">✕ Eliminar</button>
          </div>
        </div>
      `;
    }).join("");

    totalBox.innerHTML = `
      <div class="carrito-total-inner">
        <p>Total</p>
        <h2>${isPeru ? "S/" : "$"} ${total.toFixed(2)}</h2>
      </div>
    `;

    botonesBox.innerHTML = `
      <button class="btn-outline" onclick="clearCart()">Vaciar carrito</button>
      <div class="carrito-pagos-premium">
        ${isPeru ? `
          <button class="btn-yape">Pagar con Yape</button>
        ` : `
          <div id="paypal-buttons-container"></div>
          <button class="btn-stripe" onclick="sendCheckout('stripe', ${total}, getCart())">
            Pagar ahora
          </button>
        `}
      </div>
    `;

    // Renderizamos PayPal fuera del template literal
    if (!isPeru) {
      paypal.Buttons().render('#paypal-buttons-container');
    }
  }

  function increaseQty(id, stock) {
    const carrito = getCart();
    const item = carrito.find(i => i.id === id);
    if (!item) return;
    if (item.qty >= stock) {
      showToast("No hay más unidades disponibles");
      return;
    }
    item.qty++;
    saveCart(carrito);
    renderCarrito();
  }

  function decreaseQty(id) {
    const carrito = getCart();
    const item = carrito.find(i => i.id === id);
    if (!item) return;
    item.qty = Math.max(1, item.qty - 1);
    saveCart(carrito);
    renderCarrito();
  }

  function removeItem(id) {
    let carrito = getCart();
    carrito = carrito.filter(i => i.id !== id);
    saveCart(carrito);
    renderCarrito();
  }

  function clearCart() {
    saveCart([]);
    renderCarrito();
    updateCartBadge();
    showToast("Carrito vaciado");
  }

  document.addEventListener("DOMContentLoaded", renderCarrito);
</script>
</body>
</html>
